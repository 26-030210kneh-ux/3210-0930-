<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    background: #0f172a;
    color: white;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}

.game-container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    text-align: center;
}

.game-title {
    margin-bottom: 10px;
    font-size: 26px;
    font-weight: 800;
    color: #f8fafc;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.info-box {
    padding: 10px 5px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

.info-value {
    display: block;
    margin-top: 3px;
    color: #38bdf8;
    font-size: 20px;
}

#game {
    display: block;
    width: 100%;
    max-width: 700px;
    height: auto;
    margin: 0 auto;

    background: #020617;

    border: 3px solid #38bdf8;
    border-radius: 12px;

    box-shadow:
        0 0 25px
        rgba(56, 189, 248, 0.22);

    touch-action: none;
}

.message {
    min-height: 28px;
    margin-top: 10px;

    color: #e2e8f0;

    font-size: 16px;
    font-weight: bold;
}

#startButton {
    margin-top: 5px;
    padding: 12px 28px;

    border: none;
    border-radius: 10px;

    background: #38bdf8;
    color: #082f49;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;
}

#startButton:hover {
    background: #7dd3fc;
}

.mobile-controls {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-top: 12px;
}

.control-button {
    width: 120px;
    min-height: 46px;

    border: none;
    border-radius: 10px;

    background: #334155;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    touch-action: none;
    user-select: none;
}

.control-button:active {
    background: #475569;
    transform: scale(0.97);
}

.help {
    margin-top: 10px;

    color: #94a3b8;

    font-size: 13px;
    line-height: 1.6;
}

@media (max-width: 500px) {

    body {
        padding: 5px;
    }

    .game-title {
        font-size: 21px;
    }

    .info-box {
        padding: 7px 3px;
        font-size: 12px;
    }

    .info-value {
        font-size: 17px;
    }

    .mobile-controls {
        gap: 8px;
    }

    .control-button {
        width: 105px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <div class="game-title">
        🧱 BRICK BREAKER
    </div>

    <div class="info">

        <div class="info-box">
            점수
            <span
                class="info-value"
                id="score">
                0
            </span>
        </div>

        <div class="info-box">
            목숨
            <span
                class="info-value"
                id="lives">
                3
            </span>
        </div>

        <div class="info-box">
            레벨
            <span
                class="info-value"
                id="level">
                1
            </span>
        </div>

    </div>

    <canvas
        id="game"
        width="700"
        height="500">
    </canvas>

    <div
        class="message"
        id="message">
        시작 버튼을 눌러주세요!
    </div>

    <button id="startButton">
        게임 시작
    </button>

    <div class="mobile-controls">

        <button
            class="control-button"
            id="leftButton">
            ◀ 왼쪽
        </button>

        <button
            class="control-button"
            id="rightButton">
            오른쪽 ▶
        </button>

    </div>

    <div class="help">
        PC: ← → 방향키<br>
        마우스: 패들 위에서 움직이기<br>
        모바일: 화면을 터치하거나 아래 버튼 사용
    </div>

</div>

<script>
"use strict";

/* =========================================
   DOM
========================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const scoreElement =
    document.getElementById("score");

const livesElement =
    document.getElementById("lives");

const levelElement =
    document.getElementById("level");

const messageElement =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");


/* =========================================
   캔버스
========================================= */

const WIDTH = 700;
const HEIGHT = 500;


/* =========================================
   게임 상태
========================================= */

let score = 0;
let lives = 3;
let level = 1;

let gameRunning = false;

let animationFrame = null;

let leftPressed = false;
let rightPressed = false;


/* =========================================
   공
========================================= */

const ball = {

    x: WIDTH / 2,

    y: HEIGHT - 80,

    radius: 8,

    dx: 4,

    dy: -4
};


/* =========================================
   패들
========================================= */

const paddle = {

    width: 110,

    height: 14,

    x: WIDTH / 2 - 55,

    y: HEIGHT - 35,

    speed: 8
};


/* =========================================
   벽돌
========================================= */

const brickSettings = {

    rows: 6,

    columns: 9,

    width: 64,

    height: 24,

    padding: 10,

    offsetTop: 45,

    offsetLeft: 29
};

let bricks = [];


/* =========================================
   벽돌 색상
========================================= */

const brickColors = [

    "#ef4444",

    "#f97316",

    "#eab308",

    "#22c55e",

    "#06b6d4",

    "#8b5cf6"
];


/* =========================================
   UI
========================================= */

function updateUI() {

    scoreElement.textContent =
        score;

    livesElement.textContent =
        lives;

    levelElement.textContent =
        level;
}


/* =========================================
   벽돌 생성
========================================= */

function createBricks() {

    bricks = [];

    for (
        let row = 0;
        row < brickSettings.rows;
        row++
    ) {

        const currentRow = [];

        for (
            let column = 0;
            column < brickSettings.columns;
            column++
        ) {

            currentRow.push({

                x:
                    brickSettings.offsetLeft +
                    column *
                    (
                        brickSettings.width +
                        brickSettings.padding
                    ),

                y:
                    brickSettings.offsetTop +
                    row *
                    (
                        brickSettings.height +
                        brickSettings.padding
                    ),

                width:
                    brickSettings.width,

                height:
                    brickSettings.height,

                alive: true,

                color:
                    brickColors[
                        row %
                        brickColors.length
                    ]
            });
        }

        bricks.push(currentRow);
    }
}


/* =========================================
   공 속도
========================================= */

function getBallSpeed() {

    return 4.5 +
        (level - 1) * 0.55;
}


/* =========================================
   공 초기화
========================================= */

function resetBall() {

    const speed =
        getBallSpeed();

    ball.x =
        WIDTH / 2;

    ball.y =
        HEIGHT - 80;

    ball.dx =
        speed *
        (
            Math.random() < 0.5
                ? -1
                : 1
        );

    ball.dy =
        -speed;
}


/* =========================================
   패들 초기화
========================================= */

function resetPaddle() {

    paddle.x =
        WIDTH / 2 -
        paddle.width / 2;
}


/* =========================================
   게임 초기화
========================================= */

function resetGame() {

    score = 0;

    lives = 3;

    level = 1;

    createBricks();

    resetBall();

    resetPaddle();

    updateUI();
}


/* =========================================
   배경
========================================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            HEIGHT
        );

    gradient.addColorStop(
        0,
        "#020617"
    );

    gradient.addColorStop(
        1,
        "#111827"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/* =========================================
   공 그리기
========================================= */

function drawBall() {

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#38bdf8";

    ctx.shadowBlur =
        14;

    ctx.fill();

    ctx.shadowBlur =
        0;

    ctx.closePath();
}


/* =========================================
   패들 그리기
========================================= */

function drawPaddle() {

    const gradient =
        ctx.createLinearGradient(
            0,
            paddle.y,
            0,
            paddle.y +
            paddle.height
        );

    gradient.addColorStop(
        0,
        "#7dd3fc"
    );

    gradient.addColorStop(
        1,
        "#0284c7"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.roundRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height,
        7
    );

    ctx.fill();

    ctx.closePath();
}


/* =========================================
   벽돌 그리기
========================================= */

function drawBricks() {

    for (
        const row of bricks
    ) {

        for (
            const brick of row
        ) {

            if (!brick.alive) {
                continue;
            }

            ctx.fillStyle =
                brick.color;

            ctx.beginPath();

            ctx.roundRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height,
                5
            );

            ctx.fill();

            ctx.strokeStyle =
                "rgba(255,255,255,0.3)";

            ctx.stroke();

            ctx.closePath();
        }
    }
}


/* =========================================
   그리기
========================================= */

function draw() {

    drawBackground();

    drawBricks();

    drawPaddle();

    drawBall();
}


/* =========================================
   패들 이동
========================================= */

function movePaddle() {

    if (leftPressed) {

        paddle.x -=
            paddle.speed;
    }

    if (rightPressed) {

        paddle.x +=
            paddle.speed;
    }

    if (paddle.x < 0) {

        paddle.x = 0;
    }

    if (
        paddle.x +
        paddle.width >
        WIDTH
    ) {

        paddle.x =
            WIDTH -
            paddle.width;
    }
}


/* =========================================
   패들 충돌
========================================= */

function checkPaddleCollision() {

    const collision =

        ball.x + ball.radius >
            paddle.x &&

        ball.x - ball.radius <
            paddle.x +
            paddle.width &&

        ball.y + ball.radius >
            paddle.y &&

        ball.y - ball.radius <
            paddle.y +
            paddle.height &&

        ball.dy > 0;

    if (!collision) {
        return;
    }

    ball.y =
        paddle.y -
        ball.radius;

    /*
        패들의 맞은 위치를
        -1 ~ +1로 변환
    */

    const hitPosition =

        (
            ball.x -
            (
                paddle.x +
                paddle.width / 2
            )
        ) /
        (
            paddle.width / 2
        );

    const currentSpeed =

        Math.sqrt(
            ball.dx * ball.dx +
            ball.dy * ball.dy
        );

    const angle =

        hitPosition *
        Math.PI *
        0.38;

    ball.dx =
        Math.sin(angle) *
        currentSpeed;

    ball.dy =
        -Math.abs(
            Math.cos(angle) *
            currentSpeed
        );
}


/* =========================================
   벽돌 충돌
========================================= */

function checkBrickCollision() {

    for (
        const row of bricks
    ) {

        for (
            const brick of row
        ) {

            if (!brick.alive) {
                continue;
            }

            const collision =

                ball.x +
                    ball.radius >
                    brick.x &&

                ball.x -
                    ball.radius <
                    brick.x +
                    brick.width &&

                ball.y +
                    ball.radius >
                    brick.y &&

                ball.y -
                    ball.radius <
                    brick.y +
                    brick.height;

            if (!collision) {
                continue;
            }

            brick.alive =
                false;

            score += 10;

            /*
                충돌 방향을 확인해서
                공의 방향을 자연스럽게 바꾼다.
            */

            const previousX =
                ball.x -
                ball.dx;

            const previousY =
                ball.y -
                ball.dy;

            const hitFromSide =

                previousX +
                    ball.radius <=
                    brick.x ||

                previousX -
                    ball.radius >=
                    brick.x +
                    brick.width;

            if (hitFromSide) {

                ball.dx *= -1;

            } else {

                ball.dy *= -1;
            }

            updateUI();

            return;
        }
    }
}


/* =========================================
   남은 벽돌 확인
========================================= */

function getRemainingBricks() {

    let count = 0;

    for (
        const row of bricks
    ) {

        for (
            const brick of row
        ) {

            if (brick.alive) {
                count++;
            }
        }
    }

    return count;
}


/* =========================================
   레벨 클리어
========================================= */

function checkLevelClear() {

    if (
        getRemainingBricks() !== 0
    ) {

        return;
    }

    if (level >= 5) {

        gameRunning =
            false;

        cancelAnimationFrame(
            animationFrame
        );

        messageElement.textContent =
            "🎉 ALL CLEAR! 최종 점수: " +
            score;

        startButton.textContent =
            "다시 시작";

        return;
    }

    level++;

    createBricks();

    resetBall();

    resetPaddle();

    updateUI();

    messageElement.textContent =
        "🔥 LEVEL " +
        level +
        " 시작!";
}


/* =========================================
   공 이동
========================================= */

function moveBall() {

    ball.x +=
        ball.dx;

    ball.y +=
        ball.dy;


    /*
        왼쪽 벽
    */

    if (
        ball.x -
        ball.radius <= 0
    ) {

        ball.x =
            ball.radius;

        ball.dx =
            Math.abs(
                ball.dx
            );
    }


    /*
        오른쪽 벽
    */

    if (
        ball.x +
        ball.radius >= WIDTH
    ) {

        ball.x =
            WIDTH -
            ball.radius;

        ball.dx =
            -Math.abs(
                ball.dx
            );
    }


    /*
        위쪽 벽
    */

    if (
        ball.y -
        ball.radius <= 0
    ) {

        ball.y =
            ball.radius;

        ball.dy =
            Math.abs(
                ball.dy
            );
    }


    checkPaddleCollision();

    checkBrickCollision();


    /*
        바닥에 떨어짐
    */

    if (
        ball.y -
        ball.radius >
        HEIGHT
    ) {

        lives--;

        updateUI();

        if (lives <= 0) {

            gameOver();

            return;
        }

        resetBall();

        resetPaddle();

        messageElement.textContent =
            "💔 공을 놓쳤습니다! " +
            "남은 목숨: " +
            lives;
    }

    checkLevelClear();
}


/* =========================================
   게임 오버
========================================= */

function gameOver() {

    gameRunning =
        false;

    cancelAnimationFrame(
        animationFrame
    );

    messageElement.textContent =
        "💀 GAME OVER! " +
        "최종 점수: " +
        score;

    startButton.textContent =
        "다시 시작";
}


/* =========================================
   게임 루프
========================================= */

function gameLoop() {

    if (!gameRunning) {
        return;
    }

    movePaddle();

    moveBall();

    draw();

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================
   게임 시작
========================================= */

function startGame() {

    if (animationFrame !== null) {

        cancelAnimationFrame(
            animationFrame
        );
    }

    resetGame();

    gameRunning =
        true;

    messageElement.textContent =
        "🔥 게임 시작!";

    startButton.textContent =
        "다시 시작";

    gameLoop();
}


/* =========================================
   키보드
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            leftPressed =
                true;

            event.preventDefault();
        }

        if (
            event.key === "ArrowRight"
        ) {

            rightPressed =
                true;

            event.preventDefault();
        }

        if (
            event.code === "Space"
        ) {

            if (!gameRunning) {
                startGame();
            }

            event.preventDefault();
        }
    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            leftPressed =
                false;
        }

        if (
            event.key === "ArrowRight"
        ) {

            rightPressed =
                false;
        }
    }
);


/* =========================================
   마우스
========================================= */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        const scaleX =
            WIDTH /
            rect.width;

        const mouseX =
            (
                event.clientX -
                rect.left
            ) *
            scaleX;

        paddle.x =
            mouseX -
            paddle.width / 2;

        if (paddle.x < 0) {

            paddle.x = 0;
        }

        if (
            paddle.x +
            paddle.width >
            WIDTH
        ) {

            paddle.x =
                WIDTH -
                paddle.width;
        }
    }
);


/* =========================================
   터치
========================================= */

canvas.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

        const touch =
            event.touches[0];

        if (!touch) {
            return;
        }

        const rect =
            canvas.getBoundingClientRect();

        const scaleX =
            WIDTH /
            rect.width;

        const touchX =
            (
                touch.clientX -
                rect.left
            ) *
            scaleX;

        paddle.x =
            touchX -
            paddle.width / 2;

        if (paddle.x < 0) {

            paddle.x = 0;
        }

        if (
            paddle.x +
            paddle.width >
            WIDTH
        ) {

            paddle.x =
                WIDTH -
                paddle.width;
        }
    },
    {
        passive: false
    }
);


/* =========================================
   모바일 버튼
========================================= */

function setupHoldButton(
    button,
    direction
) {

    button.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            if (
                direction === "left"
            ) {

                leftPressed =
                    true;
            }

            if (
                direction === "right"
            ) {

                rightPressed =
                    true;
            }
        }
    );

    button.addEventListener(
        "pointerup",
        function() {

            if (
                direction === "left"
            ) {

                leftPressed =
                    false;
            }

            if (
                direction === "right"
            ) {

                rightPressed =
                    false;
            }
        }
    );

    button.addEventListener(
        "pointercancel",
        function() {

            leftPressed =
                false;

            rightPressed =
                false;
        }
    );

    button.addEventListener(
        "pointerleave",
        function() {

            if (
                direction === "left"
            ) {

                leftPressed =
                    false;
            }

            if (
                direction === "right"
            ) {

                rightPressed =
                    false;
            }
        }
    );
}


setupHoldButton(
    leftButton,
    "left"
);

setupHoldButton(
    rightButton,
    "right"
);


/* =========================================
   시작 버튼
========================================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================================
   첫 화면
========================================= */

resetGame();

draw();

</script>

</body>
</html>
